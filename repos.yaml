# Repositories to track. Each entry is "owner/name" or a mapping that overrides the defaults.
defaults:
  # Org used for entries given without an owner/ prefix.
  owner: Odido-Datascience-BI-Analytics
  base_branch: main
  # GitHub deployment environment to match (e.g. deploy-higher-environments); null = any.
  environment: deploy-higher-environments #null
  # Workflow file names that count as deployments (e.g. [deploy.yml]); empty = all push workflows.
  workflows: []

